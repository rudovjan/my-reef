services:
  my-reef:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      MY_REEF_DATA_DIR: /data
    volumes:
      - my-reef-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
volumes:
  my-reef-data:
